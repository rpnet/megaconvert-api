[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megaconvert"
version = "1.0.0"
description = "Official Python SDK for the MegaConvert API — convert files between 500+ formats"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "MegaConvert", email = "support@megaconvert.io"}]
dependencies = ["requests>=2.20.0"]
keywords = ["megaconvert", "file-conversion", "convert", "pdf", "image", "video", "audio", "api", "cloudconvert-alternative"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://megaconvert.io"
Documentation = "https://megaconvert.io/docs/api"
Repository = "https://github.com/rpnet/megaconvert-api"
Issues = "https://github.com/rpnet/megaconvert-api/issues"

[tool.setuptools.packages.find]
where = ["src"]
